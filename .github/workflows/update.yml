name: 更新订阅

# 每 6 小时自动跑一次，也可以手动点 "Run workflow"
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '最终保留节点数'
        required: false
        default: '800'
      pre_limit:
        description: '送测节点数（越大越慢越准）'
        required: false
        default: '3000'

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行聚合器
        run: |
          python aggregate.py \
            --pre-limit ${{ github.event.inputs.pre_limit || '3000' }} \
            --limit ${{ github.event.inputs.limit || '800' }} \
            --timeout 3 \
            --workers 96

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ || true
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "订阅更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 输出访问地址
        run: |
          echo "### 订阅已更新" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Clash / FlClash 订阅：**" >> $GITHUB_STEP_SUMMARY
          echo "\`https://raw.githubusercontent.com/${{ github.repository }}/main/output/merged.yaml\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**v2rayN / v2rayNG 订阅：**" >> $GITHUB_STEP_SUMMARY
          echo "\`https://raw.githubusercontent.com/${{ github.repository }}/main/output/merged.txt\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**jsDelivr 加速版（国内更快）：**" >> $GITHUB_STEP_SUMMARY
          echo "\`https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/output/merged.yaml\`" >> $GITHUB_STEP_SUMMARY
